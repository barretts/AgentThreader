name: Release to npm

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --passWithNoTests

      - name: Compile skills
        run: npm run compile

      - name: Validate compiled skills
        run: npm run compile:validate

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEXT_VERSION=$(node -e "const [major, minor, patch] = require('./package.json').version.split('.').map(Number); console.log([major, minor, patch + 1].join('.'));")
          npm version "$NEXT_VERSION" -m "chore(release): %s"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        run: git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
